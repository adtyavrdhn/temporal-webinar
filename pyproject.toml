[project]
name = "hiring-posts"
version = "0.1.0"
description = "Label 14 years of Hacker News hiring posts with Pydantic AI, durable on Temporal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "logfire[agent-sandboxes]==5.6.0",
    "pydantic-ai-harness[codemode,temporal]==0.71.0",
    "pydantic-ai-slim[anthropic,logfire,openai,typesafe]==2.71.0",
    "python-dotenv>=1.0",
    "temporalio==1.36.1",
]

[project.scripts]
worker = "hiring.plumbing.worker:main"
label = "hiring.plumbing.label:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hiring"

[dependency-groups]
dev = ["pyright>=1.1.400", "ruff>=0.14"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
